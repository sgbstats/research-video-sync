name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest
      - name: Build source and wheel distributions
        run: python -m build
      - name: Install and smoke-test the wheel
        run: |
          python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', glob.glob('dist/*.whl')[0]])"
          research-video-sync --version
          python -c "import subprocess,sys,tempfile; subprocess.run([sys.executable, '-m', 'rg2019', '--version'], cwd=tempfile.gettempdir(), check=True)"

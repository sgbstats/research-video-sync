[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-video-sync"
version = "2.0.0"
description = "Audio-based synchronization pipeline for RG2019 follow-up videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "static-ffmpeg>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7", "build>=1"]

[project.scripts]
research-video-sync = "rg2019.cli:main"

[tool.setuptools]
packages = ["rg2019"]
py-modules = ["pipeline_rg2019"]

[tool.setuptools.package-data]
rg2019 = ["config.example.json"]
